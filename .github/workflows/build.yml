name: Build APK

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write # нужно только для публикации релиза по тегу v*

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - uses: gradle/actions/setup-gradle@v4

      - name: Проверить, что встроенные компиляторы на месте
        run: |
          test -s app/src/main/assets/jvm-tools.zip
          python3 -c "import zipfile; z=zipfile.ZipFile('app/src/main/assets/jvm-tools.zip'); print(sorted(z.namelist()))"

      - name: Собрать debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Назвать файл
        id: apk
        run: |
          src=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          out="apk-tbuilder-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          ls -la "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-builder
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Релиз по тегу
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" --generate-notes
